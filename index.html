<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karta Gracza</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="player-card">
    <header class="card-header">
      <h1>Karta Gracza</h1>
      <p>Nick: <span class="highlight">Mniami</span></p>
    </header>

    <section class="card-section bio">
      <h2>Bio</h2>
      <p>Poziom: <strong>42</strong></p>
      <p>Klasa: <strong>Wojownik</strong></p>
      <p>Gildia: <strong>Turbo Giganci</strong></p>
    </section>

    <section class="card-section equipment">
      <h2>Ekwipunek</h2>
      <ul>
        <li>Róża płomieni +5</li>
        <li>Szata Arcymaga</li>
        <li>Metalowa magiczna tarcza</li>
      </ul>
    </section>

    <footer class="card-footer">
      <p>Ostatnia aktywność: <time datetime="2026-10-05">5 Października</time></p>
    </footer>
  </main>
</body>

</html>
